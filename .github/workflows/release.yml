# GitHub Actions: build the APK on GitHub's machines.
#
# Move this file to .github/workflows/release.yml (GitHub only runs workflows from there).
#
#   - Every push and pull request: builds a debug APK and runs the unit tests, so a broken
#     build shows up right away. The APK is kept with the run for a week.
#   - A tag like v0.2.0: builds the release APK, signs it with the repo's release key, and
#     puts it on a Release page anyone can download from.
#
# The release key lives in the repo's secrets (Settings, Secrets and variables, Actions):
#   LUNA_KEYSTORE_BASE64   the keystore file, base64 encoded
#   LUNA_KEYSTORE_PASSWORD
#   LUNA_KEY_ALIAS
#   LUNA_KEY_PASSWORD
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK and run the tests
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: luna-station-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write            # to create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No LUNA_KEYSTORE_BASE64 secret: add the release key to the repo's secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build and sign the release APK
        env:
          LUNA_KEYSTORE: ${{ runner.temp }}/release.jks
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          # the version is in app/build.gradle.kts (publish-github.sh --tag writes it); the tag must match
          LUNA_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$LUNA_VERSION\"" app/build.gradle.kts; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName in app/build.gradle.kts: tag with publish-github.sh --tag."
            exit 1
          fi
          chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "luna-station-$LUNA_VERSION.apk"
          sha256sum "luna-station-$LUNA_VERSION.apk" > "luna-station-$LUNA_VERSION.apk.sha256"
      - name: Put it on a Release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" luna-station-*.apk luna-station-*.apk.sha256 \
            --title "Luna Station ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Remove the key from the machine
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
